<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Python IDE</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: white; margin: 0; padding: 1em; }
    textarea { width: 100%; height: 50vh; background: #252526; color: #dcdcdc; border: none; padding: 1em; font-family: monospace; }
    pre { background: #111; padding: 1em; white-space: pre-wrap; }
    button { margin-top: 1em; padding: 0.5em 1em; font-size: 1em; }
  </style>
</head>
<body>
  <h1>🐍 My Python IDE</h1>
  <textarea id="code" placeholder="print('Hello, world!')"></textarea><br>
  <button id="run">Run ▶️</button>
  <pre id="output"></pre>

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.mjs";
    let pyodide = await loadPyodide();
    document.getElementById("run").onclick = async () => {
      const code = document.getElementById("code").value;
      const output = document.getElementById("output");
      output.textContent = "Running...";
      try {
        const result = await pyodide.runPythonAsync(code);
        output.textContent = result !== undefined ? result : "Done!";
      } catch (err) {
        output.textContent = "Error: " + err;
      }
    };
  </script>
</body>
</html>
